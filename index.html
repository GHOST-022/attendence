<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f8fafc" />
  <title>بوابة - United Pharmacy</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Cairo", "sans-serif"],
          },
          animation: {
            scan: "scan 2s linear infinite",
            pulseSoft: "pulseSoft 3s cubic-bezier(0.4, 0, 0.6, 1) infinite",
            float: "float 6s ease-in-out infinite",
          },
          keyframes: {
            scan: {
              "0%": { transform: "translateY(0)" },
              "50%": { transform: "translateY(200px)" },
              "100%": { transform: "translateY(0)" },
            },
            pulseSoft: {
              "0%, 100%": { opacity: 1, transform: "scale(1)" },
              "50%": { opacity: .7, transform: "scale(1.05)" },
            },
            float: {
              "0%, 100%": { transform: "translateY(0px)" },
              "50%": { transform: "translateY(-10px)" },
            }
          },
        },
      },
    };
  </script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: transparent;
      position: relative;
      overflow: hidden;
    }

    /* Scanner UI Enhancements */
    .scanner-wrapper {
      position: relative;
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      border-radius: 30px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 20px 50px -10px rgba(20, 184, 166, 0.4);
      border: 4px solid #fff;
    }

    .scanner-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(20, 184, 166, 0.1) 0%, transparent 100%);
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #14b8a6;
      box-shadow: 0 0 15px #14b8a6, 0 0 30px #14b8a6;
      z-index: 30;
    }

    #reader img,
    #reader button,
    #reader a {
      display: none !important;
    }

    #reader select {
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 10px;
      width: 90%;
      background: white;
      border: none;
      font-family: Cairo;
      font-weight: bold;
      color: #0f172a;
      outline: none;
    }

    /* Toasts */
    #toast-container {
      position: fixed;
      bottom: 30px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      color: #0f172a;
      padding: 16px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error i {
      color: #ef4444;
    }

    .toast.success i {
      color: #10b981;
    }

    .hidden-view {
      display: none !important;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 0px;
    }
  </style>
</head>

<body>
  <div class="mobile-container custom-scrollbar">

    <!-- View: Dashboard -->

  <div id="toast-container"></div>

  <script>
    // ==========================================
    // 1. الإعدادات (محدثة لمنع تعارض الـ Clients)
    // ==========================================
    const SUPABASE_URL = "https://xxyqhysgzhmpqvrdihgs.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_J39GMgFyogT6GyqRZfwiag_M4uQI2G_";

    let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // حل مشكلة الـ 406 والـ Auth Conflict
    let setupClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false },
      global: {
        headers: { 'x-client-info': 'setup-client' }
      }
    });

    let currentUser = null;
    let currentEmployeeRecord = null;
    let currentBranchRecord = null;
    let activeLogId = null;
    let currentScanAction = null;

    // ==========================================
    // 2. دوال مساعدة للواجهة
    // ==========================================
    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;

      let icon = '<i class="fa-solid fa-circle-info text-blue-500 text-lg"></i>';
      if (type === 'success') icon = '<i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i>';
      if (type === 'error') icon = '<i class="fa-solid fa-triangle-exclamation text-rose-500 text-lg"></i>';

      toast.innerHTML = `${icon}<span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => toast.classList.add("show"), 10);
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    }

    function switchView(viewId) {
      document.getElementById("loginView").classList.add("hidden-view");
      document.getElementById("dashboardView").classList.add("hidden-view");
      document.getElementById(viewId).classList.remove("hidden-view");
    }

    function setLoadingState(btnId, isLoading, originalText, iconClass) {
      const btn = document.getElementById(btnId);
      if (isLoading) {
        btn.disabled = true;
        btn.innerHTML = `<span class="relative z-10"><i class="fa-solid fa-circle-notch animate-spin ml-2"></i> جاري المعالجة...</span>`;
        btn.style.opacity = "0.8";
      } else {
        btn.disabled = false;
        btn.innerHTML = `<span class="relative z-10">${originalText}</span> <i class="${iconClass} relative z-10 group-hover:-translate-x-1 transition-transform"></i>`;
        btn.style.opacity = "1";
      }
    }

    // ==========================================
    // 3. البصمة الرقمية و الـ IP
    // ==========================================
    async function getDeviceFingerprint() {
      try {
        const screen = `${window.screen.width}x${window.screen.height}`;
        const userAgent = navigator.userAgent;
        const lang = navigator.language;
        const rawData = `MOB-${screen}-${userAgent}-${lang}`;
        const msgBuffer = new TextEncoder().encode(rawData);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
      } catch (error) {
        return "mobile_fb_" + Math.random().toString(36).substr(2, 9);
      }
    }

    async function fetchMobileIP() {
      try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();
        return data.ip;
      } catch (error) {
        return null;
      }
    }

    // ==========================================
    // 4. تسجيل الدخول
    // ==========================================
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!supabaseClient) return;

      const email = document.getElementById("emailInput").value;
      const password = document.getElementById("passwordInput").value;
      setLoadingState("loginBtn", true);

      try {
        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (authError) throw new Error("بيانات الدخول غير صحيحة.");

        currentUser = authData.user;

        const { data: empData, error: empError } = await supabaseClient
          .from("employees")
          .select("*, branches!branch_id(name, active_ip)")
          .eq("id", currentUser.id)
          .single();

        if (empError || !empData) throw new Error("لا يوجد حساب موظف مرتبط.");
        if (empData.role !== "pharmacist") throw new Error("هذه الواجهة للصيادلة فقط.");
        if (!empData.branch_id) throw new Error("أنت لست معيناً في أي فرع.");

        currentEmployeeRecord = empData;
        currentBranchRecord = empData.branches;

        const currentFingerprint = await getDeviceFingerprint();

        if (!empData.mobile_fingerprint) {
          await supabaseClient.from("employees").update({ mobile_fingerprint: currentFingerprint }).eq("id", empData.id);
          showToast("تم توثيق الجهاز بنجاح", "success");
        } else if (empData.mobile_fingerprint !== currentFingerprint) {
          await supabaseClient.auth.signOut();
          throw new Error("هاتف غير مصرح به. راجع الإدارة.");
        }

        document.getElementById("employeeName").textContent = empData.full_name;
        document.getElementById("branchName").textContent = currentBranchRecord.name;

        switchView("dashboardView");
        await checkLocationAndStatus();
      } catch (error) {
        showToast(error.message, "error");
      } finally {
        setLoadingState("loginBtn", false, "دخول للنظام", "fa-solid fa-arrow-left");
      }
    });

    // ==========================================
    // 5. التحقق من التواجد و الحالة
    // ==========================================
    async function checkLocationAndStatus() {
      const elements = {
        actionArea: document.getElementById("actionArea"),
        warning: document.getElementById("networkWarning"),
        scanBtn: document.getElementById("openScannerBtn"),
        scanArea: document.getElementById("scannerArea"),
        checkoutBtn: document.getElementById("checkOutBtn"),
        statusTxt: document.getElementById("statusText"),
        note: document.getElementById("attendanceNote")
      };

      // إخفاء الكل للتهيئة
      Object.values(elements).forEach(el => {
        if (el && el.classList) el.classList.add("hidden-view");
      });

      const mobileIp = await fetchMobileIP();
      const { data: updatedBranch } = await supabaseClient
        .from("branches")
        .select("active_ip")
        .eq("id", currentEmployeeRecord.branch_id)
        .single();

      const branchIp = updatedBranch ? updatedBranch.active_ip : currentBranchRecord.active_ip;

      if (mobileIp !== branchIp) {
        elements.warning.classList.remove("hidden-view");
        return;
      }

      const { data: logs } = await supabaseClient
        .from("attendance_logs")
        .select("*")
        .eq("employee_id", currentEmployeeRecord.id)
        .order("created_at", { ascending: false })
        .limit(1);

      elements.actionArea.classList.remove("hidden-view");

      if (logs && logs.length > 0 && !logs[0].check_out_time) {

        // حساب الوقت المنقضي منذ تسجيل الحضور
        const checkInTime = new Date(logs[0].check_in_time || logs[0].created_at);
        const now = new Date();
        const diffHours = (now - checkInTime) / (1000 * 60 * 60);

        // اكتشاف التلاعب (مرور أكثر من 14 ساعة)
        if (diffHours > 14) {
          activeLogId = null;

          // 📍 1. إظهار إشعار منبثق (Toast) تحذيري باللون الأحمر 📍
          showToast("تنبيه: تم رصد تلاعب في ورديتك السابقة لعدم تسجيل الانصراف!", "error");

          // إظهار زر "تسجيل حضور" ليوم جديد
          elements.statusTxt.textContent = "متصل وجاهز للتسجيل";
          elements.scanBtn.classList.remove("hidden-view");

          // 📍 2. تغيير النص الإرشادي لرسالة تحذيرية دائمة باللون الأحمر 📍
          elements.note.innerHTML = '<span class="text-red-500 font-extrabold"><i class="fa-solid fa-triangle-exclamation"></i> تم تسجيل ورديتك السابقة "تلاعب" لعدم الانصراف. نرجو الالتزام مستقبلاً.<br>مسح الرمز الآن سيسجل حضوراً جديداً.</span>';
          elements.note.classList.remove("hidden-view");

          return; // نخرج هنا لمنع مسح الرسالة التحذيرية

        } else {
          // وردية طبيعية، نظهر له زر الانصراف
          activeLogId = logs[0].id;
          elements.statusTxt.textContent = "حضورك مسجل حالياً";
          elements.checkoutBtn.classList.remove("hidden-view");
          elements.note.textContent = "اضغط على الزر أعلاه لتسجيل الانصراف عند نهاية الدوام.";
          elements.note.classList.remove("hidden-view");
          return;
        }
      }

      // الكود الافتراضي (للموظف الملتزم أو من ليس لديه سجلات معلقة)
      elements.statusTxt.textContent = "متصل وجاهز للتسجيل";
      elements.scanBtn.classList.remove("hidden-view");
      elements.note.textContent = "اضغط للبدء، ثم قم بتوجيه الكاميرا نحو شاشة الكاشير لمسح الرمز";
      elements.note.classList.remove("hidden-view");
    }

    // ==========================================
    // 6. الكاميرا و الـ QR
    // ==========================================
    let html5QrcodeScanner = null;

    // استقبال نوع الإجراء (in أو out)
    function startQRScanner(actionType) {
      currentScanAction = actionType;

      // إخفاء الأزرار والملاحظات
      document.getElementById("scannerArea").classList.remove("hidden-view");
      document.getElementById("openScannerBtn").classList.add("hidden-view");
      document.getElementById("checkOutBtn").classList.add("hidden-view");
      document.getElementById("attendanceNote").classList.add("hidden-view");

      // 📍 التنظيف المسبق: التأكد من تفريغ أي كاميرا معلقة قبل تشغيل كاميرا جديدة 📍
      if (html5QrcodeScanner) {
        try { html5QrcodeScanner.clear(); } catch (e) { }
      }

      html5QrcodeScanner = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };

      html5QrcodeScanner.start({ facingMode: "environment" }, config, onQrCodeSuccess, onQrCodeError)
        .catch(err => {
          html5QrcodeScanner.start({ facingMode: "user" }, config, onQrCodeSuccess, onQrCodeError)
            .catch(finalErr => {
              showToast("يرجى إعطاء صلاحية الكاميرا للمتصفح.", "error");
              cancelScan();
            });
        });
    }

    async function cancelScan() {
      document.getElementById("scannerArea").classList.add("hidden-view");

      await checkLocationAndStatus();

      // 📍 الإغلاق السليم والتنظيف عند الإلغاء 📍
      if (html5QrcodeScanner) {
        try { await html5QrcodeScanner.stop(); } catch (error) { }
        try { html5QrcodeScanner.clear(); } catch (error) { }
      }
    }

    async function onQrCodeSuccess(decodedText) {
      // 📍 الإغلاق السليم والتنظيف عند نجاح المسح عشان الكاميرا تفتح في الانصراف 📍
      if (html5QrcodeScanner) {
        try { await html5QrcodeScanner.stop(); } catch (e) { }
        try { html5QrcodeScanner.clear(); } catch (e) { }
      }

      document.getElementById("scannerArea").classList.add("hidden-view");

      try {
        showToast("جاري توثيق وتحليل الرمز...", "info");

        if (typeof CryptoJS === "undefined") {
          throw new Error("مكتبة التشفير مفقودة، يرجى تحديث الصفحة.");
        }

        let decryptedData = "";
        try {
          const bytes = CryptoJS.AES.decrypt(decodedText, "UnitedSecretAttendance2026");
          decryptedData = bytes.toString(CryptoJS.enc.Utf8);
        } catch (e) {
          throw new Error("رمز QR غير صالح أو لا يخص منظومة United Pharmacy.");
        }

        if (!decryptedData || !decryptedData.startsWith("BRANCH-")) {
          throw new Error("رمز QR غير صالح أو من مصدر خارجي.");
        }

        // 📍 التعديل الجذري هنا: استخدام Regex لقراءة الـ ID بالكامل وتجاهل المشاكل 📍
        const match = decryptedData.match(/BRANCH-(.*?)-DATE-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)/);

        if (!match) {
          throw new Error("تنسيق الرمز تالف أو غير مكتمل.");
        }

        const scannedBranchId = match[1]; // هذا سيجلب الـ ID كاملاً حتى لو كان داخله شرطات

        if (String(scannedBranchId) !== String(currentEmployeeRecord.branch_id)) {
          throw new Error("عذراً، هذا الرمز يخص فرعاً آخر!");
        }

        const qrYear = parseInt(match[2]);
        const qrMonth = parseInt(match[3]) - 1; // الأشهر تبدأ من 0
        const qrDay = parseInt(match[4]);
        const qrHour = parseInt(match[5]);
        const qrMinute = parseInt(match[6]);

        const qrDate = new Date(qrYear, qrMonth, qrDay, qrHour, qrMinute);
        const now = new Date();
        const diffMinutes = Math.abs((now - qrDate) / 1000 / 60);

        // جعلنا الصلاحية دقيقتين كحد أقصى تفادياً لاختلاف ثواني الساعات بين الكاشير وهاتف الموظف
        if (diffMinutes > 2) {
          throw new Error("رمز QR منتهي الصلاحية. يرجى مسح الرمز الحالي من شاشة الكاشير مباشرة.");
        }

        const mobileIp = await fetchMobileIP();

        if (currentScanAction === 'in') {
          const { error } = await supabaseClient.from("attendance_logs").insert([{
            employee_id: currentEmployeeRecord.id,
            branch_id: currentEmployeeRecord.branch_id,
            check_in_ip: mobileIp
          }]);
          if (error) throw error;
          showToast("تم تسجيل حضورك بنجاح!", "success");

        } else if (currentScanAction === 'out') {
          if (!activeLogId) throw new Error("لا يوجد تسجيل حضور نشط للانصراف منه.");
          const { error } = await supabaseClient.from("attendance_logs")
            .update({ check_out_time: new Date().toISOString(), check_out_ip: mobileIp })
            .eq("id", activeLogId);
          if (error) throw error;
          showToast("تم الانصراف بنجاح. يوم سعيد!", "success");
          activeLogId = null;
        }

        await checkLocationAndStatus();

      } catch (error) {
        showToast(error.message || "فشل التسجيل، حاول مرة أخرى.", "error");
        await checkLocationAndStatus();
      }
    }

    function onQrCodeError(errorMessage) { } // صامت

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      if (supabaseClient) await supabaseClient.auth.signOut();
      currentUser = null;
      currentEmployeeRecord = null;
      switchView("loginView");
    });

    // ==========================================
    // استعادة الجلسة عند الريفريش ومنع تسجيل الخروج التلقائي
    // ==========================================
    window.addEventListener("DOMContentLoaded", async () => {
      if (!supabaseClient) return;

      try {
        const { data: { session } } = await supabaseClient.auth.getSession();

        if (session) {
          const { data: empData, error: empError } = await supabaseClient
            .from("employees")
            .select("*, branches!branch_id(name, active_ip)")
            .eq("id", session.user.id)
            .single();

          if (empError || !empData || empData.role !== "pharmacist") {
            await supabaseClient.auth.signOut();
            return;
          }

          currentUser = session.user;
          currentEmployeeRecord = empData;
          currentBranchRecord = empData.branches;

          document.getElementById("employeeName").textContent = empData.full_name;
          document.getElementById("branchName").textContent = currentBranchRecord.name;

          switchView("dashboardView");
          await checkLocationAndStatus();
        }
      } catch (e) {
        console.error("خطأ في استعادة جلسة الموظف:", e);
      }
    });
